name: Audit & Deploy Static Site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enforce Zero-JS Audit
        shell: pwsh
        run: |
          $htmlFiles = Get-ChildItem -Recurse -Filter "*.html" . | Where-Object { $_.FullName -notmatch "archive" }
          $scriptTags = $htmlFiles | Select-String -Pattern "<script"
          if ($scriptTags) {
              Write-Error "SECURITY FAIL: Unauthorized <script> tag detected in content HTML!"
              exit 1
          } else {
              Write-Output "AUDIT PASSED: Zero-JS verified across all content pages."
          }

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
