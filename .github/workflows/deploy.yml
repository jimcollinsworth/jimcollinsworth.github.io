name: Audit & Deploy Pure Static Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  audit:
    name: Security & HTML Integrity Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enforce Zero-JS & Link Integrity
        shell: pwsh
        run: |
          $htmlFiles = Get-ChildItem -Recurse -Filter "*.html" . | Where-Object { $_.FullName -notmatch "archive" }
          $issues = @()

          foreach ($file in $htmlFiles) {
              $content = Get-Content -Raw $file.FullName
              $relPath = $file.FullName.Replace((Get-Location).Path + "/", "")

              # 1. Enforce Zero JavaScript
              if ($content -match "<script") {
                  $issues += "SECURITY FAIL: $relPath contains unauthorized <script> tag!"
              }

              # 2. Check internal link integrity
              $hrefMatches = [regex]::Matches($content, 'href="([^"#:]+)"')
              foreach ($m in $hrefMatches) {
                  $link = $m.Groups[1].Value
                  if ($link -notmatch "^(http|mailto|#)") {
                      $targetDir = Split-Path $file.FullName
                      $resolved = [System.IO.Path]::GetFullPath([System.IO.Path]::Combine($targetDir, $link))
                      if (-not (Test-Path $resolved)) {
                          $issues += "LINK FAIL: In $relPath, link '$link' does not exist!"
                      }
                  }
              }

              # 3. Check internal image asset integrity
              $srcMatches = [regex]::Matches($content, 'src="([^":]+)"')
              foreach ($m in $srcMatches) {
                  $src = $m.Groups[1].Value
                  if ($src -notmatch "^(http|data:)") {
                      $targetDir = Split-Path $file.FullName
                      $resolved = [System.IO.Path]::GetFullPath([System.IO.Path]::Combine($targetDir, $src))
                      if (-not (Test-Path $resolved)) {
                          $issues += "ASSET FAIL: In $relPath, image '$src' does not exist!"
                      }
                  }
              }
          }

          if ($issues.Count -gt 0) {
              $issues | ForEach-Object { Write-Error $_ }
              exit 1
          } else {
              Write-Output "SUCCESS: Zero JS verified and all internal links/assets valid."
          }

  deploy:
    name: Deploy to GitHub Pages
    needs: audit
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
