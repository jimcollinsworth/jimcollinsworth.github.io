<!DOCTYPE html>
<html lang="{{ DEFAULT_LANG }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ SITENAME }}{% if SITESUBTITLE %} &mdash; {{ SITESUBTITLE }}{% endif %}{% endblock %}</title>
  <link rel="stylesheet" href="{{ SITEURL }}/theme/css/style.css">
  <link rel="icon" href="{{ SITEURL }}/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="{{ SITEURL }}/favicon.ico" type="image/x-icon">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <input type="checkbox" id="theme-toggle" class="sr-only mode-toggle-input">
  <input type="checkbox" id="contrast-toggle" class="sr-only mode-toggle-input">
  <input type="checkbox" id="text-size-toggle" class="sr-only mode-toggle-input">
  <div class="container">
    <header class="site-header" role="banner">
      <div class="site-branding">
        <div class="site-identity">
          <div class="site-title"><a href="{{ SITEURL }}/index.html">{{ SITENAME }}</a></div>
          <div class="site-tagline">{{ SITESUBTITLE }}</div>
        </div>
        <div class="site-controls" role="group" aria-label="Display and accessibility preferences">
          <label for="theme-toggle" class="control-btn" title="Toggle theme (Light / Dark)" aria-label="Toggle theme (Light / Dark)">
            <svg class="control-icon icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="control-icon icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <span class="sr-only">Toggle theme</span>
          </label>
          <label for="contrast-toggle" class="control-btn" title="Toggle high contrast" aria-label="Toggle high contrast">
            <svg class="control-icon icon-contrast" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M12 2a10 10 0 0 1 0 20z" fill="currentColor"></path>
            </svg>
            <span class="sr-only">Toggle high contrast</span>
          </label>
          <label for="text-size-toggle" class="control-btn" title="Toggle larger text size" aria-label="Toggle larger text size">
            <svg class="control-icon icon-text-size" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <text x="3" y="17" font-size="14" font-weight="700" fill="currentColor" font-family="sans-serif">A</text>
              <text x="14" y="13" font-size="10" font-weight="700" fill="currentColor" font-family="sans-serif">A</text>
            </svg>
            <span class="sr-only">Toggle larger text size</span>
          </label>
        </div>
      </div>
      <nav class="site-nav" aria-label="Main Navigation">
        <a href="{{ SITEURL }}/index.html"{% if output_file == 'index.html' %} class="active" aria-current="page"{% endif %}>Home</a>
        <a href="{{ SITEURL }}/about.html"{% if page and page.slug == 'about' %} class="active" aria-current="page"{% endif %}>About</a>
        <a href="{{ SITEURL }}/posts.html"{% if output_file == 'posts.html' or article or category %} class="active" aria-current="page"{% endif %}>Posts</a>
        <a href="{{ SITEURL }}/reads.html"{% if page and page.slug == 'reads' %} class="active" aria-current="page"{% endif %}>Reads</a>
        <a href="{{ SITEURL }}/gallery.html"{% if page and page.slug == 'gallery' %} class="active" aria-current="page"{% endif %}>Gallery</a>
      </nav>
    </header>

    <main id="main-content" tabindex="-1">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer" role="contentinfo">
      <nav class="footer-nav" aria-label="Footer Navigation">
        <a href="{{ SITEURL }}/index.html">Home</a>
        <a href="{{ SITEURL }}/about.html">About</a>
        <a href="{{ SITEURL }}/posts.html">Posts</a>
        <a href="{{ SITEURL }}/reads.html">Reads</a>
        <a href="{{ SITEURL }}/gallery.html">Gallery</a>
        <a href="{{ SITEURL }}/devops.html">DevOps</a>
        <a href="https://photos.app.goo.gl/yGTTSd3hnw1pqCPo8" target="_blank" rel="noopener">Google Photos <span class="sr-only">(opens external photo album in new tab)</span></a>
      </nav>
      <div>
        Content &copy; Jim Collinsworth. Licensed under <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>.
      </div>
    </footer>
  </div>
</body>
</html>
