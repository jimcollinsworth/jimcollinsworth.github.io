<!DOCTYPE html>
<html lang="{{ DEFAULT_LANG }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ SITENAME }}{% if SITESUBTITLE %} &mdash; {{ SITESUBTITLE }}{% endif %}{% endblock %}</title>
  <link rel="stylesheet" href="{{ SITEURL }}/theme/css/style.css">
  <link rel="icon" href="{{ SITEURL }}/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="{{ SITEURL }}/favicon.ico" type="image/x-icon">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <div class="site-branding">
        <div class="site-title"><a href="{{ SITEURL }}/index.html">{{ SITENAME }}</a></div>
        <div class="site-tagline">{{ SITESUBTITLE }}</div>
      </div>
      <nav class="site-nav">
        <a href="{{ SITEURL }}/index.html"{% if output_file == 'index.html' %} class="active"{% endif %}>Home</a>
        <a href="{{ SITEURL }}/about.html"{% if page and page.slug == 'about' %} class="active"{% endif %}>About</a>
        <a href="{{ SITEURL }}/posts.html"{% if output_file == 'posts.html' or article or category %} class="active"{% endif %}>Posts</a>
        <a href="{{ SITEURL }}/reads.html"{% if page and page.slug == 'reads' %} class="active"{% endif %}>Reads</a>
        <a href="{{ SITEURL }}/gallery.html"{% if page and page.slug == 'gallery' %} class="active"{% endif %}>Gallery</a>
      </nav>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="footer-nav">
        <a href="{{ SITEURL }}/index.html">Home</a>
        <a href="{{ SITEURL }}/about.html">About</a>
        <a href="{{ SITEURL }}/posts.html">Posts</a>
        <a href="{{ SITEURL }}/reads.html">Reads</a>
        <a href="{{ SITEURL }}/gallery.html">Gallery</a>
        <a href="https://photos.app.goo.gl/yGTTSd3hnw1pqCPo8" target="_blank" rel="noopener">Google Photos</a>
      </div>
      <div>
        Content &copy; Jim Collinsworth. Licensed under <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>.
      </div>
    </footer>
  </div>
</body>
</html>
