[project]
name = "jimcollinsworth-site"
version = "0.5.5"
description = "Pelican static site pipeline for jimcollinsworth.github.io"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pelican>=4.9.0",
    "markdown>=3.6",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.4",
]

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest>=8.3.0",
    "pytest-playwright>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
